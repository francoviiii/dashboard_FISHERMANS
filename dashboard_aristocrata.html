<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metas · O Aristocrata</title>
<style>
:root{--bg:#0f1420;--card:#171d2b;--card2:#1e2536;--line:#2a3346;--txt:#e6eaf2;--mut:#8b95a8;--acc:#6ea8fe;
  --v:#3fce85;--vbg:#123a22;--a:#e6b53d;--abg:#3a2f10;--r:#f0736f;--rbg:#3a1a1a;--n:#8b95a8;--track:#212a3d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5;padding:30px 18px;
  background:radial-gradient(38% 38% at 14% 4%,rgba(90,162,255,.12),transparent 60%),radial-gradient(38% 38% at 88% 3%,rgba(169,139,255,.10),transparent 60%),linear-gradient(180deg,#070c16,#0a1322 55%,#070c16);background-attachment:fixed;padding-top:66px}
.wrap{max-width:1080px;margin:0 auto}
.gv-top{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;gap:13px;padding:11px 18px;background:rgba(8,13,22,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08)}
.gv-back{display:inline-flex;align-items:center;gap:7px;text-decoration:none;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:#eaf0f8;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);padding:7px 14px;border-radius:22px}
.gv-back:hover{background:rgba(255,255,255,.12);border-color:rgba(216,185,120,.55);color:#fff}
.gv-brand{display:flex;align-items:center;gap:9px;font-size:12.5px;color:#9fb0c6;min-width:0}
.gv-brand .cr{width:26px;height:26px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#12233c,#0a1626);border:1px solid rgba(216,185,120,.35);color:#d8b978;font-family:Georgia,serif;font-weight:700;font-size:14px}
.gv-brand b{color:#eaf0f8;font-weight:700}.gv-brand .pg{color:#d8b978;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:600px){.gv-brand .sys{display:none}}
header h1{font-size:25px;font-weight:750;letter-spacing:-.3px}
header .sub{color:var(--acc);font-weight:600;font-size:14px;margin-top:3px}
header .meta{color:var(--mut);margin-top:5px;font-size:13px}
.demo{margin:16px 0 0;padding:11px 15px;border-radius:11px;background:rgba(230,181,61,.12);border:1px solid rgba(230,181,61,.4);color:#f0d488;font-size:12.5px}
.demo b{color:#ffe9a8}
h2.sec{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.7px;margin:30px 0 14px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px}
.hero .top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-1px;line-height:1}
.hero .of{color:var(--mut);font-size:14px;margin-top:6px}
.hero .of b{color:var(--txt)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:22px}
.pill.g{background:var(--vbg);color:var(--v)}.pill.a{background:var(--abg);color:var(--a)}.pill.r{background:var(--rbg);color:var(--r)}
.pbar{height:14px;background:var(--track);border-radius:8px;overflow:hidden;margin-top:16px;position:relative}
.pbar .fill{height:100%;border-radius:8px}
.pbar .ideal{position:absolute;top:-4px;bottom:-4px;width:2px;background:#dfe6f2}
.pace{font-size:12.5px;color:var(--mut);margin-top:9px}
.pace b{color:var(--txt)}
.htiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.ht{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.ht .v{font-size:20px;font-weight:750}.ht .l{color:var(--mut);font-size:11.5px;margin-top:2px}
.ht .s{font-size:11px;color:var(--mut);margin-top:3px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.row{display:grid;grid-template-columns:150px 1fr 210px;align-items:center;gap:12px;margin-bottom:11px}
.row:last-child{margin-bottom:0}
.rl{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl .tp{color:var(--mut);font-size:11px}
.track{background:var(--track);border-radius:6px;height:13px;overflow:hidden;position:relative}
.track .f{height:100%;border-radius:6px}
.rv{font-size:12.5px;text-align:right;color:var(--txt);font-variant-numeric:tabular-nums}
.rv .m{color:var(--mut)}
.tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;padding:1px 7px;border-radius:20px;margin-left:6px;background:var(--abg);color:var(--a);vertical-align:middle}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.area{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.area h3{font-size:16px;font-weight:700;margin-bottom:2px}
.area .asrc{color:var(--mut);font-size:11.5px;margin-bottom:12px}
.kpi{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-top:1px solid var(--line2,#1e2536)}
.kpi:first-of-type{border-top:none}
.kpi .kn{font-size:12.5px;color:var(--txt)}
.kpi .kn .src{display:block;color:var(--mut);font-size:10.5px;margin-top:1px}
.kpi .kv{font-size:15px;font-weight:750;white-space:nowrap;font-variant-numeric:tabular-nums}
.note{color:var(--mut);font-size:12.5px;margin-top:16px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.note b{color:var(--txt)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:11.5px;color:var(--mut)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
footer{color:var(--mut);font-size:12px;text-align:center;margin-top:26px}
@media(max-width:760px){.htiles{grid-template-columns:1fr}.areas{grid-template-columns:1fr}.row{grid-template-columns:120px 1fr;grid-template-areas:'l v' 'l t'}.row .track{grid-column:1/-1}}
</style></head>
<body>
<div class="gv-top">
  <a class="gv-back" href="index.html">← Central</a>
  <div class="gv-brand"><span class="cr">S</span><span class="sys"><b>Central de Governança</b> · </span><span class="pg">Metas · O Aristocrata</span></div>
</div>
<div class="wrap">
<header>
<h1>Painel de Metas — O Aristocrata</h1>
<div class="sub">Receita × Meta · objetivo comum da marca</div>
<div class="meta" id="metaline"></div>
</header>
<div id="app"></div>
<div class="note" id="methodnote"></div>
<footer id="foot"></footer>
</div>
<script>
let D=null;
const money=v=>v==null?"—":("R$ "+Math.round(v).toLocaleString("pt-BR"));
const moneyK=v=>{ if(v==null) return "—"; if(Math.abs(v)>=1e6) return "R$ "+(v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:2})+"M"; if(Math.abs(v)>=1e3) return "R$ "+(v/1e3).toLocaleString("pt-BR",{maximumFractionDigits:0})+"k"; return money(v); };
const num=v=>v==null?"—":Math.round(v).toLocaleString("pt-BR");
const pct=v=>v==null?"—":(v).toLocaleString("pt-BR",{maximumFractionDigits:2})+"%";
const dec=v=>v==null?"—":v.toLocaleString("pt-BR",{maximumFractionDigits:2});
function fmtKpi(k){ switch(k.fmt){case"money":return money(k.valor);case"num":return num(k.valor);case"pct":return pct(k.valor);case"x":return k.valor==null?"—":dec(k.valor)+"×";case"dec":return dec(k.valor);case"dias":return k.valor==null?"—":num(k.valor)+" dias";default:return k.valor;} }
function esc(s){ return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

// status por RITMO: realizado vs. o que era esperado até hoje (proporcional aos dias)
function paceRatio(real,meta){ if(!meta) return null; const ideal=meta*(D.diaDoMes/D.diasNoMes); return ideal?real/ideal:null; }
function paceClass(real,meta){ const r=paceRatio(real,meta); if(r==null) return "n"; if(r>=1) return "g"; if(r>=0.9) return "a"; return "r"; }
function colorOf(c){ return c==="g"?"var(--v)":c==="a"?"var(--a)":c==="r"?"var(--r)":"var(--n)"; }

function render(){
  el("metaline").textContent = D.mes + " · dia " + D.diaDoMes + " de " + D.diasNoMes + " · meta " + moneyK(D.meta.receita);
  let h="";
  if(D.demo){ h+=`<div class="demo"><b>⚠️ Dados de exemplo.</b> As metas são reais (da sua planilha), mas o <b>realizado</b> ainda é ilustrativo. Quando o n8n ligar Solomon + Shopify, este aviso some e os números ficam de verdade.</div>`; }

  // ---------- TOPO: objetivo comum ----------
  const mr=D.meta.receita, rr=D.realizado.receita||0;
  const falta=Math.max(0,mr-rr), pctMeta=mr?rr/mr*100:0;
  const ideal=mr*(D.diaDoMes/D.diasNoMes), diff=rr-ideal;
  const pc=paceClass(rr,mr);
  const paceTxt = diff>=0
    ? `No ritmo ideal você estaria em <b>${moneyK(ideal)}</b> hoje — está <b style="color:var(--v)">${moneyK(Math.abs(diff))} acima</b> do ritmo.`
    : `No ritmo ideal você estaria em <b>${moneyK(ideal)}</b> hoje — está <b style="color:var(--r)">${moneyK(Math.abs(diff))} abaixo</b> do ritmo.`;
  h+=`<div class="hero">
    <div class="top">
      <div><div class="big">${money(rr)}</div><div class="of">de <b>${money(mr)}</b> — faltam <b>${money(falta)}</b></div></div>
      <div class="pill ${pc}">${pctMeta.toFixed(1)}% da meta</div>
    </div>
    <div class="pbar"><div class="fill" style="width:${Math.min(100,pctMeta).toFixed(1)}%;background:${colorOf(pc)}"></div><div class="ideal" style="left:${Math.min(100,D.diaDoMes/D.diasNoMes*100).toFixed(1)}%" title="ritmo ideal"></div></div>
    <div class="pace">${paceTxt} <span style="opacity:.7">(a marca clara na barra = onde o ritmo ideal está hoje)</span></div>
    <div class="htiles">
      <div class="ht"><div class="v">${num(D.realizado.vendas)}</div><div class="l">Vendas</div><div class="s">meta ${num(D.meta.vendas)}</div></div>
      <div class="ht"><div class="v">${D.realizado.vendas?money(rr/D.realizado.vendas):"—"}</div><div class="l">Ticket médio</div><div class="s">meta ${money(D.meta.ticket)}</div></div>
      <div class="ht"><div class="v" style="color:${colorOf(pc)}">${pc==="g"?"No ritmo":pc==="a"?"Levemente atrás":"Atrás do ritmo"}</div><div class="l">Status do mês</div><div class="s">dia ${D.diaDoMes}/${D.diasNoMes}</div></div>
    </div>
  </div>`;

  // ---------- RITMO SEMANAL ----------
  h+=`<h2 class="sec">Ritmo semanal · meta × realizado</h2><div class="panel">`;
  const maxW=Math.max(...D.semanas.map(s=>Math.max(s.metaReceita,s.realizadoReceita||0)),1);
  D.semanas.forEach(s=>{
    const rz=s.realizadoReceita||0; const p=s.metaReceita?rz/s.metaReceita*100:0;
    const future=rz===0 && !s.parcial;
    const cls = future?"n":(s.parcial?"a":(p>=100?"g":p>=90?"a":"r"));
    h+=`<div class="row"><div class="rl">Semana ${s.label}${s.parcial?' <span class="tp">(em curso)</span>':''}</div>
      <div class="track" title="meta ${money(s.metaReceita)}"><div class="f" style="width:${Math.min(100,s.metaReceita?rz/s.metaReceita*100:0).toFixed(1)}%;background:${colorOf(cls)}"></div></div>
      <div class="rv">${moneyK(rz)} <span class="m">/ ${moneyK(s.metaReceita)}</span></div></div>`;
  });
  h+=`<div class="legend"><span><i style="background:var(--v)"></i>no ritmo / batido</span><span><i style="background:var(--a)"></i>em curso ou levemente atrás</span><span><i style="background:var(--r)"></i>abaixo</span><span><i style="background:var(--n)"></i>ainda não iniciada</span></div></div>`;

  // ---------- POR CANAL ----------
  h+=`<h2 class="sec">Meta × realizado por canal</h2><div class="panel">`;
  const canais=[...D.canais].sort((a,b)=>b.metaReceita-a.metaReceita);
  canais.forEach(c=>{
    const rz=c.realizadoReceita||0; const pm=c.metaReceita?rz/c.metaReceita*100:0; const cls=paceClass(rz,c.metaReceita);
    h+=`<div class="row"><div class="rl">${esc(c.canal)}${c.atribuicao==="parcial"?'<span class="tag">atrib. parcial</span>':''}<div class="tp">${esc(c.tipo)}</div></div>
      <div class="track" title="ritmo ${(paceRatio(rz,c.metaReceita)*100||0).toFixed(0)}% do ideal"><div class="f" style="width:${Math.min(100,pm).toFixed(1)}%;background:${colorOf(cls)}"></div></div>
      <div class="rv">${moneyK(rz)} <span class="m">/ ${moneyK(c.metaReceita)} · ${pm.toFixed(0)}%</span></div></div>`;
  });
  h+=`<div class="legend"><span>Cor = <b style="color:var(--txt)">ritmo</b> (realizado vs. o esperado até hoje), não % puro da meta. <i style="background:var(--v);margin-left:8px"></i>no ritmo <i style="background:var(--a)"></i>quase <i style="background:var(--r)"></i>atrás</span></div>
    <div class="legend" style="margin-top:6px"><span><span class="tag" style="margin:0">atrib. parcial</span> canal com atribuição não 100% confiável (marketplace / afiliado) — ler com ressalva.</span></div></div>`;

  // ---------- POR ÁREA ----------
  h+=`<h2 class="sec">KPIs por área</h2><div class="areas">`;
  D.areas.forEach(a=>{
    const fontes=[...new Set(a.kpis.map(k=>k.fonte))].join(" · ");
    h+=`<div class="area"><h3>${esc(a.titulo)}${a.atribuicao==="parcial"?'<span class="tag">atrib. parcial</span>':''}</h3><div class="asrc">Fontes: ${esc(fontes)}</div>`;
    a.kpis.forEach(k=>{
      h+=`<div class="kpi"><div class="kn">${esc(k.nome)}<span class="src">${esc(k.fonte)}${k.atribuicao==="parcial"?" · atrib. parcial":""}</span></div><div class="kv">${fmtKpi(k)}</div></div>`;
    });
    h+=`</div>`;
  });
  h+=`</div>`;

  el("app").innerHTML=h;
  el("methodnote").innerHTML=`<b>Como ler:</b> o topo é o <b>objetivo comum</b> da marca (receita × meta do mês, em faturamento bruto). A cor mede <b>ritmo</b> — o quanto você já fez comparado ao que era esperado até hoje —, então mid-mês em verde já é bom sinal, não precisa estar em 100%. <b>Meta × realizado por canal</b> mostra quem está puxando o número. Canais e KPIs de <b>marketplace/afiliado</b> vêm marcados como <b>atribuição parcial</b> (nem toda venda é rastreável 100%). Fontes: Solomon, Shopify e planilha Histórico de KPIs, via n8n.`;
  el("foot").textContent="Fonte: Solomon · Shopify · planilha Histórico de KPIs — via n8n · "+D.mes;
}
function el(id){return document.getElementById(id);}

fetch("dados_aristocrata.json?v="+Date.now(),{cache:"no-store"}).then(r=>r.text()).then(t=>{D=JSON.parse(t.replace(/^[﻿\s=]+/,''));try{render();}catch(e){console.error(e);el("app").innerHTML='<div class="note">Os dados chegaram, mas houve um detalhe ao montar a tela. Recarregue; se persistir, me avise.<br><small style="color:#8b95a8">'+(e&&e.message||'')+'</small></div>';}}).catch(()=>{el("app").innerHTML='<div class="note">Ainda não consegui ler o <b>dados_aristocrata.json</b> no repositório. Assim que o arquivo estiver lá (ou o n8n rodar), o painel aparece.</div>';});
</script>
</body></html>
