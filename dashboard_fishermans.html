<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metas · Fishermans</title>
<style>
:root{--bg:#0f1420;--card:#171d2b;--card2:#1e2536;--line:#2a3346;--txt:#e6eaf2;--mut:#8b95a8;--acc:#6ea8fe;
  --v:#3fce85;--vbg:#123a22;--a:#e6b53d;--abg:#3a2f10;--r:#f0736f;--rbg:#3a1a1a;--n:#8b95a8;--track:#212a3d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--txt);line-height:1.5;padding:30px 18px;
  background:radial-gradient(38% 38% at 14% 4%,rgba(90,162,255,.12),transparent 60%),radial-gradient(38% 38% at 88% 3%,rgba(169,139,255,.10),transparent 60%),linear-gradient(180deg,#070c16,#0a1322 55%,#070c16);background-attachment:fixed;padding-top:66px}
.wrap{max-width:1080px;margin:0 auto}
.gv-top{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;gap:13px;padding:11px 18px;background:rgba(8,13,22,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08)}
.gv-back{display:inline-flex;align-items:center;gap:7px;text-decoration:none;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:#eaf0f8;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);padding:7px 14px;border-radius:22px}
.gv-back:hover{background:rgba(255,255,255,.12);border-color:rgba(216,185,120,.55);color:#fff}
.gv-brand{display:flex;align-items:center;gap:9px;font-size:12.5px;color:#9fb0c6;min-width:0}
.gv-brand .cr{width:26px;height:26px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#12233c,#0a1626);border:1px solid rgba(216,185,120,.35);color:#d8b978;font-family:Georgia,serif;font-weight:700;font-size:14px}
.gv-brand b{color:#eaf0f8;font-weight:700}.gv-brand .pg{color:#d8b978;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:600px){.gv-brand .sys{display:none}}
.logo-fish{height:50px;width:auto;max-width:min(400px,70vw);display:block;margin-bottom:12px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45))}
header h1{font-size:25px;font-weight:750;letter-spacing:-.3px}
header .sub{color:var(--acc);font-weight:600;font-size:14px;margin-top:3px}
header .meta{color:var(--mut);margin-top:5px;font-size:13px}
.demo{margin:16px 0 0;padding:11px 15px;border-radius:11px;background:rgba(230,181,61,.12);border:1px solid rgba(230,181,61,.4);color:#f0d488;font-size:12.5px}
.demo b{color:#ffe9a8}
h2.sec{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.7px;margin:28px 0 13px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px}
.hero .top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px}
.hero .kk{font-size:11.5px;color:var(--acc);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-1px;line-height:1;margin-top:4px}
.hero .of{color:var(--mut);font-size:14px;margin-top:6px}.hero .of b{color:var(--txt)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:22px}
.pill.g{background:var(--vbg);color:var(--v)}.pill.a{background:var(--abg);color:var(--a)}.pill.r{background:var(--rbg);color:var(--r)}
.pbar{height:14px;background:var(--track);border-radius:8px;overflow:hidden;margin-top:16px;position:relative}
.pbar .fill{height:100%;border-radius:8px}
.pbar .ideal{position:absolute;top:-4px;bottom:-4px;width:2px;background:#dfe6f2}
.pace{font-size:12.5px;color:var(--mut);margin-top:9px}.pace b{color:var(--txt)}
.htiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.ht{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.ht .v{font-size:20px;font-weight:750}.ht .l{color:var(--mut);font-size:11.5px;margin-top:2px}.ht .s{font-size:11px;color:var(--mut);margin-top:3px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.chart{overflow-x:auto}
.row{display:grid;grid-template-columns:170px 1fr 200px;align-items:center;gap:12px;margin-bottom:11px}
.row:last-child{margin-bottom:0}
.rl{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rl .tp{color:var(--mut);font-size:11px}
.track{background:var(--track);border-radius:6px;height:13px;overflow:hidden}
.track .f{height:100%;border-radius:6px}
.rv{font-size:12.5px;text-align:right;color:var(--txt);font-variant-numeric:tabular-nums}.rv .m{color:var(--mut)}
.areas{display:flex;flex-direction:column;gap:14px}
.area{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.area h3{font-size:16px;font-weight:700;margin-bottom:2px}
.area .asrc{color:var(--mut);font-size:11.5px;margin-bottom:13px}
.tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;padding:1px 7px;border-radius:20px;margin-left:6px;background:var(--abg);color:var(--a);vertical-align:middle}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:12px}
.kcard{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;display:flex;flex-direction:column}
.kcard .kn{font-size:12.5px;color:var(--txt);font-weight:600;line-height:1.25}
.kcard .src{color:var(--mut);font-size:10.5px;margin-top:2px}
.kcard .brk{color:var(--acc);font-size:10.5px;margin-top:2px}
.kcard .valrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:8px 0 2px}
.kcard .kv{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.kcard .kd{font-size:10.5px;color:var(--mut);white-space:nowrap}
.kcard .spk{width:100%;height:56px;display:block;margin-top:4px}
.note{color:var(--mut);font-size:12.5px;margin-top:16px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.note b{color:var(--txt)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:11.5px;color:var(--mut)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
/* barra empilhada: soma dos canais × meta */
.smcap{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.smcap .tot{font-size:26px;font-weight:800;letter-spacing:-.5px}.smcap .tot .m{color:var(--mut);font-size:15px;font-weight:600}
.smcap .pillm{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:22px;background:var(--card2);border:1px solid var(--line)}
.smbar{height:30px;background:var(--track);border-radius:9px;position:relative;overflow:hidden}
.smbar .seg{position:absolute;top:0;height:100%;transition:width .3s}
.smbar .tick{position:absolute;top:-5px;bottom:-5px;width:2px;background:#dfe6f2;z-index:4}
.smbar .tick b{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:9px;color:#dfe6f2;white-space:nowrap;font-weight:600}
.smscale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut);margin-top:5px}
.smleg{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.smleg .it{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;flex:1 1 160px}
.smleg .sw{width:12px;height:12px;border-radius:4px;flex:none}
.smleg .tx{min-width:0}.smleg .tx .n{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.smleg .tx .v{font-size:14px;font-weight:750;font-variant-numeric:tabular-nums}.smleg .tx .v .p{color:var(--mut);font-size:11px;font-weight:600}
footer{color:var(--mut);font-size:12px;text-align:center;margin-top:26px}
@media(max-width:760px){.htiles{grid-template-columns:1fr}.row{grid-template-columns:130px 1fr;grid-template-areas:'l v' 'l t'}.row .track{grid-column:1/-1}}
</style></head>

<h1>Painel de Metas — Fishermans</h1>
<div class="sub">Faturamento × Meta · quadrimestre SET–DEZ 2026</div>
<div class="meta" id="metaline"></div>
</header>
<div id="app"></div>
<div class="note" id="methodnote"></div>
<footer id="foot"></footer>
</div>
<script>
let D=null;
const money=v=>v==null?"—":("R$ "+Math.round(v).toLocaleString("pt-BR"));
const moneyK=v=>{ if(v==null) return "—"; if(Math.abs(v)>=1e6) return "R$ "+(v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:2})+"M"; if(Math.abs(v)>=1e3) return "R$ "+(v/1e3).toLocaleString("pt-BR",{maximumFractionDigits:0})+"k"; return money(v); };
const num=v=>v==null?"—":Math.round(v).toLocaleString("pt-BR");
const pctf=v=>v==null?"—":(v).toLocaleString("pt-BR",{maximumFractionDigits:2})+"%";
const dec=v=>v==null?"—":v.toLocaleString("pt-BR",{maximumFractionDigits:2});
function fmtKpi(k){ switch(k.fmt){case"money":return money(k.valor);case"num":return num(k.valor);case"pct":return pctf(k.valor);case"x":return k.valor==null?"—":dec(k.valor)+"×";case"dec":return dec(k.valor);case"dias":return k.valor==null?"—":num(k.valor)+" dias";default:return k.valor;} }
function esc(s){ return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function el(id){return document.getElementById(id);}
function paceRatio(real,meta){ if(!meta) return null; const ideal=meta*(D.diaDoMes/D.diasNoMes); return ideal?real/ideal:null; }
function paceClass(real,meta){ const r=paceRatio(real,meta); if(r==null) return "n"; if(r>=1) return "g"; if(r>=0.9) return "a"; return "r"; }
function colorOf(c){ return c==="g"?"var(--v)":c==="a"?"var(--a)":c==="r"?"var(--r)":"var(--n)"; }
/* cor categórica por canal (distinta das cores de status verde/amarelo/vermelho) */
function canalCor(nome){ const s=(nome||"").toLowerCase();
  if(/d2c|site|shopify/.test(s)) return "#6ea8fe";      // azul
  if(/marketplace/.test(s))      return "#a98bff";      // roxo
  if(/b2b|atacado/.test(s))      return "#38c6b4";      // turquesa
  if(/influenc|afili/.test(s))   return "#f48fb1";      // rosa
  return "#8b95a8"; }
/* nome curto da área (sem pessoa) */
function canalCurto(nome){ const s=(nome||"").toLowerCase();
  if(/d2c|site|shopify/.test(s)) return "Site";
  if(/marketplace/.test(s))      return "Marketplaces";
  if(/b2b|atacado/.test(s))      return "B2B";
  if(/influenc|afili/.test(s))   return "Influencers";
  return nome; }
/* barra empilhada: soma dos canais (arrecadado do mês) × meta do mês */
function stackedMetaBar(){
  const meta = (D.meses.find(m=>m.mes===D.mesCorrente)||{}).meta || 0;
  const segs = D.canais.filter(c=>c.consolidavel!==false)   // Influencers/Orgânico ficam de fora: já entram no site (Shopify)
                       .map(c=>({nome:canalCurto(c.canal), cor:canalCor(c.canal), val:(c.real&&c.real[D.mesCorrente])||0}))
                       .filter(s=>s.val>0).sort((a,b)=>b.val-a.val);
  const total = segs.reduce((a,s)=>a+s.val,0);
  const pct = meta?total/meta*100:0;
  const idealPct = D.diasNoMes?D.diaDoMes/D.diasNoMes*100:0;
  // segmentos posicionados em cascata (largura = val/meta), clipados em 100%
  let cum=0, bars="";
  segs.forEach(s=>{ const left=meta?cum/meta*100:0; const w=meta?s.val/meta*100:0;
    bars+=`<div class="seg" style="left:${left.toFixed(2)}%;width:${w.toFixed(2)}%;background:${s.cor}" title="${esc(s.nome)}: ${money(s.val)}"></div>`; cum+=s.val; });
  const tick = idealPct>0&&idealPct<100 ? `<div class="tick" style="left:${idealPct.toFixed(1)}%"><b>ritmo hoje</b></div>` : "";
  const falta = Math.max(0, meta-total);
  const pcls = pct>=idealPct?"var(--v)":pct>=idealPct*0.9?"var(--a)":"var(--r)";
  const leg = segs.map(s=>`<div class="it"><span class="sw" style="background:${s.cor}"></span><div class="tx"><div class="n">${esc(s.nome)}</div><div class="v">${moneyK(s.val)} <span class="p">${meta?(s.val/meta*100).toFixed(0):0}% da meta</span></div></div></div>`).join("");
  return `<h2 class="sec">Soma dos canais × meta · ${esc(D.mesCorrenteLabel)}</h2><div class="panel">
    <div class="smcap"><div class="tot">${money(total)} <span class="m">/ ${money(meta)}</span></div>
      <div class="pillm" style="color:${pcls}">${pct.toFixed(1)}% da meta · faltam ${moneyK(falta)}</div></div>
    <div class="smbar">${bars}${tick}</div>
    <div class="smscale"><span>0</span><span>meta ${moneyK(meta)}</span></div>
    <div class="smleg">${leg}</div>
    <div class="legend" style="margin-top:14px">Consolidado = <b style="color:var(--txt)">Site D2C (Shopify)</b> + <b style="color:var(--txt)">Marketplaces</b> + <b style="color:var(--txt)">B2B</b>. Influencers e Orgânico não entram aqui — suas vendas já caem <b style="color:var(--txt)">dentro do site</b> (contar de novo seria duplicar). A barra cheia = <b style="color:var(--txt)">meta</b>; a marca clara = onde você deveria estar <b style="color:var(--txt)">hoje</b> no ritmo.</div>
  </div>`;
}

/* ---- séries semanais dos KPIs (usa k.hist se existir; senão sintetiza p/ demo) ---- */
function hashStr(s){let h=0;for(let i=0;i<(s||"").length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
function histOf(k){ if(Array.isArray(k.hist)&&k.hist.length>1) return k.hist.map(Number);
  const v=+k.valor||0; const seed=hashStr(k.nome); const n=6; const arr=[];
  for(let i=0;i<n;i++){ const t=i/(n-1); const wig=(((seed>>(i*3))&7)/7-0.5)*0.12; arr.push(Math.max(0, v*(0.80+0.20*t)+v*wig)); }
  arr[n-1]=v; return arr; }
function sparkSVG(arr,labels){ const W=100,H=40,p=3; const mn=Math.min(...arr),mx=Math.max(...arr); const rng=(mx-mn)||1;
  const pts=arr.map((v,i)=>[ p+i/(arr.length-1)*(W-2*p), H-p-((v-mn)/rng)*(H-2*p) ]);
  const line='M'+pts.map(pt=>pt[0].toFixed(2)+' '+pt[1].toFixed(2)).join(' L');
  const area='M'+pts[0][0].toFixed(2)+' '+(H-p)+' L'+pts.map(pt=>pt[0].toFixed(2)+' '+pt[1].toFixed(2)).join(' L')+' L'+pts[pts.length-1][0].toFixed(2)+' '+(H-p)+' Z';
  const last=pts[pts.length-1];
  return `<svg class="spk" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${area}" fill="rgba(110,168,254,.13)"/><path d="${line}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><circle cx="${last[0].toFixed(2)}" cy="${last[1].toFixed(2)}" r="2.2" fill="var(--acc)" vector-effect="non-scaling-stroke"/></svg>`; }
function deltaBadge(arr){ const a=arr[arr.length-2],b=arr[arr.length-1]; if(a==null||a===0) return '<span class="kd">vs sem. ant.</span>';
  const d=(b-a)/Math.abs(a)*100; const ar=d>0.5?'▲':d<-0.5?'▼':'•'; return `<span class="kd">${ar} ${Math.abs(d).toFixed(0)}% <span style="opacity:.7">sem.</span></span>`; }
function evoChart(evo){ const W=680,H=190,padL=46,padR=14,padT=16,padB=28; const plotW=W-padL-padR,plotH=H-padT-padB;
  const vals=evo.map(e=>e.receita); const mx=Math.max(...vals),mn=Math.min(...vals);
  const yMax=mx*1.08, yMin=Math.max(0, mn-(mx-mn)*0.25);
  const X=i=>padL+(evo.length>1?i/(evo.length-1):0)*plotW; const Y=v=>padT+plotH-((v-yMin)/((yMax-yMin)||1))*plotH;
  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet" font-family="inherit">`;
  for(let i=0;i<=3;i++){const v=yMin+(yMax-yMin)*i/3;const y=Y(v);g+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#2a3346"/><text x="${padL-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#8b95a8">${moneyK(v)}</text>`;}
  const pts=evo.map((e,i)=>[X(i),Y(e.receita)]);
  const area='M'+pts[0][0].toFixed(1)+' '+(padT+plotH)+' L'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')+' L'+pts[pts.length-1][0].toFixed(1)+' '+(padT+plotH)+' Z';
  g+=`<path d="${area}" fill="rgba(110,168,254,.14)"/>`;
  g+=`<path d="M${pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  evo.forEach((e,i)=>{g+=`<circle cx="${pts[i][0].toFixed(1)}" cy="${pts[i][1].toFixed(1)}" r="3" fill="var(--acc)"><title>${e.label}: ${money(e.receita)}</title></circle><text x="${pts[i][0].toFixed(1)}" y="${H-9}" text-anchor="middle" font-size="9.5" fill="#8b95a8">${esc(e.label)}</text>`;});
  g+=`</svg>`; return g; }

function render(){
  const mAtual=D.meses.find(m=>m.mes===D.mesCorrente)||D.meses[0];
  const quadReal=D.meses.reduce((a,m)=>a+(m.realizado||0),0);
  el("metaline").textContent = D.periodo + " · mês corrente: " + D.mesCorrenteLabel + " (dia " + D.diaDoMes + "/" + D.diasNoMes + ") · meta do quadrimestre " + moneyK(D.quadMeta);
  let h="";
  if(D.demo){ h+=`<div class="demo"><b>⚠️ Dados de exemplo.</b> As <b>metas são as reais</b> (SET–DEZ, da sua planilha); o <b>arrecadado e a evolução</b> ainda são ilustrativos. Quando ligarmos Shopify + planilha, este aviso some.</div>`; }

  // HERO
  const mr=mAtual.meta, rr=mAtual.realizado||0;
  const falta=Math.max(0,mr-rr), pctMeta=mr?rr/mr*100:0;
  const ideal=mr*(D.diaDoMes/D.diasNoMes), diff=rr-ideal;
  const proj=D.diaDoMes?rr/D.diaDoMes*D.diasNoMes:0, projPct=mr?proj/mr*100:0;
  const pc=paceClass(rr,mr);
  const paceTxt = diff>=0
    ? `No ritmo ideal você estaria em <b>${moneyK(ideal)}</b> hoje — está <b style="color:var(--v)">${moneyK(Math.abs(diff))} acima</b> do ritmo.`
    : `No ritmo ideal você estaria em <b>${moneyK(ideal)}</b> hoje — está <b style="color:var(--r)">${moneyK(Math.abs(diff))} abaixo</b> do ritmo.`;
  const projCls = projPct>=100?"g":projPct>=90?"a":"r";
  h+=`<div class="hero">
    <div class="top">
      <div><div class="kk">${esc(D.mesCorrenteLabel)} · mês corrente</div><div class="big">${money(rr)}</div><div class="of">de <b>${money(mr)}</b> — faltam <b>${money(falta)}</b></div></div>
      <div class="pill ${pc}">${pctMeta.toFixed(1)}% da meta</div>
    </div>
    <div class="pbar"><div class="fill" style="width:${Math.min(100,pctMeta).toFixed(1)}%;background:${colorOf(pc)}"></div><div class="ideal" style="left:${Math.min(100,D.diaDoMes/D.diasNoMes*100).toFixed(1)}%" title="ritmo ideal"></div></div>
    <div class="pace">${paceTxt} <span style="opacity:.7">(marca clara = ritmo ideal de hoje)</span></div>
    <div class="htiles">
      <div class="ht"><div class="v" style="color:${colorOf(projCls)}">${moneyK(proj)}</div><div class="l">Projeção de fechamento do mês</div><div class="s">${projPct.toFixed(0)}% da meta no ritmo atual</div></div>
      <div class="ht"><div class="v">${moneyK(quadReal)}</div><div class="l">Acumulado do quadrimestre</div><div class="s">de ${moneyK(D.quadMeta)} (meta SET–DEZ)</div></div>
      <div class="ht"><div class="v" style="color:${colorOf(pc)}">${pc==="g"?"No ritmo":pc==="a"?"Levemente atrás":"Atrás do ritmo"}</div><div class="l">Status do mês</div><div class="s">dia ${D.diaDoMes}/${D.diasNoMes}</div></div>
    </div>
  </div>`;

  // SOMA DOS CANAIS × META (barra empilhada)
  h+=stackedMetaBar();

  // EVOLUÇÃO SEMANAL (gráfico)
  if(Array.isArray(D.evoSemanas)&&D.evoSemanas.length){
    h+=`<h2 class="sec">Evolução semanal do faturamento · consolidado</h2><div class="panel"><div class="chart">${evoChart(D.evoSemanas)}</div></div>`;
  }

  // META POR MÊS × ARRECADADO
  h+=`<h2 class="sec">Meta por mês × arrecadado · consolidado (Site + Marketplaces + B2B)</h2><div class="panel">`;
  D.meses.forEach(m=>{
    const rz=m.realizado; const has=rz!=null; const p=m.meta?(rz||0)/m.meta*100:0;
    const cls = !has?"n":(m.corrente?paceClass(rz,m.meta):(p>=100?"g":p>=90?"a":"r"));
    h+=`<div class="row"><div class="rl">${m.mes}${m.corrente?' <span class="tp">(em curso)</span>':''}</div>
      <div class="track" title="meta ${money(m.meta)}"><div class="f" style="width:${Math.min(100,has?p:0).toFixed(1)}%;background:${colorOf(cls)}"></div></div>
      <div class="rv">${has?moneyK(rz):'<span class="m">—</span>'} <span class="m">/ ${moneyK(m.meta)}</span></div></div>`;
  });
  h+=`<div class="legend"><span><i style="background:var(--v)"></i>no ritmo / batido</span><span><i style="background:var(--a)"></i>em curso / quase</span><span><i style="background:var(--r)"></i>abaixo</span><span><i style="background:var(--n)"></i>mês futuro</span></div></div>`;

  // META POR CANAL
  h+=`<h2 class="sec">Meta por canal · ${esc(D.mesCorrenteLabel)}</h2><div class="panel">`;
  const canais=[...D.canais].sort((a,b)=>(b.meta[D.mesCorrente]||0)-(a.meta[D.mesCorrente]||0));
  canais.forEach(c=>{
    const cm=c.meta[D.mesCorrente]||0, cr=(c.real&&c.real[D.mesCorrente])||0; const p=cm?cr/cm*100:0; const cls=paceClass(cr,cm);
    const tagSite = c.consolidavel===false ? '<span class="tag" style="background:rgba(110,168,254,.15);color:var(--acc)">já no site</span>' : '';
    h+=`<div class="row"><div class="rl">${esc(c.canal)}${tagSite}${c.atribuicao==="parcial"?'<span class="tag">atrib. parcial</span>':''}<div class="tp">${esc(c.resp)} · ${esc(c.fonte)} · base ago ${moneyK(c.run)}</div></div>
      <div class="track" title="ritmo ${(paceRatio(cr,cm)*100||0).toFixed(0)}% do ideal"><div class="f" style="width:${Math.min(100,p).toFixed(1)}%;background:${colorOf(cls)}"></div></div>
      <div class="rv">${moneyK(cr)} <span class="m">/ ${moneyK(cm)} · ${p.toFixed(0)}%</span></div></div>`;
  });
  h+=`<div class="legend"><span>Cor = <b style="color:var(--txt)">ritmo</b> (arrecadado vs. esperado até hoje). <i style="background:var(--v);margin-left:8px"></i>no ritmo <i style="background:var(--a)"></i>quase <i style="background:var(--r)"></i>atrás</span></div></div>`;

  // KPIs POR ÁREA (com sparkline + variação semanal)
  h+=`<h2 class="sec">KPIs por área · evolução semanal</h2><div class="areas">`;
  D.areas.forEach(a=>{
    const fontes=[...new Set(a.kpis.map(k=>k.fonte))].join(" · ");
    h+=`<div class="area"><h3>${esc(a.titulo)}${a.atribuicao==="parcial"?'<span class="tag">atrib. parcial</span>':''}</h3><div class="asrc">Fontes: ${esc(fontes)} · gráfico = evolução das últimas semanas</div><div class="kgrid">`;
    a.kpis.forEach(k=>{
      const hist=histOf(k); const brk = k.sub ? `<div class="brk">${k.sub.map(s=>esc(s.label)+" "+num(s.valor)).join(" · ")}</div>` : "";
      h+=`<div class="kcard"><div class="kn">${esc(k.nome)}${k.atribuicao==="parcial"?'<span class="tag">parcial</span>':''}</div><div class="src">${esc(k.fonte)}</div>${brk}`
       +`<div class="valrow"><span class="kv">${fmtKpi(k)}</span>${deltaBadge(hist)}</div>`
       +`${sparkSVG(hist)}</div>`;
    });
    h+=`</div></div>`;
  });
  h+=`</div>`;

  el("app").innerHTML=h;
  el("methodnote").innerHTML=`<b>Como ler:</b> topo = <b>mês corrente</b> (arrecadado × meta) com projeção. O gráfico mostra a <b>evolução semanal do faturamento</b>. O <b>consolidado</b> = Site D2C (Shopify) + Marketplaces + B2B — os que vêm de fora do site (mais o site inteiro). <b>Influencers</b> (cupom) e <b>Orgânico</b> não somam ao consolidado porque essas vendas já entram pelo site (Shopify), senão contaria duas vezes. <b>Meta por canal</b> abre por responsável (Site D2C = Jorge/Shopify, Marketplaces = Uri, B2B = Leandro, Influencers = Marcela · marcado "já no site"). Em cada KPI, o <b>mini-gráfico</b> mostra a evolução das últimas semanas e o <b>▲/▼</b> a variação vs. a semana anterior (só magnitude — subir nem sempre é "bom", ex.: CMV). A cor das barras mede <b>ritmo</b>. Marketplace/afiliado = <b>atribuição parcial</b>.`;
  el("foot").textContent="Fonte: Shopify · Solomon · planilha Histórico de KPIs — via n8n · "+D.periodo;
}

fetch("dados_fishermans.json?v="+Date.now(),{cache:"no-store"}).then(r=>r.text()).then(t=>{D=JSON.parse(t.replace(/^[﻿\s=]+/,''));try{render();}catch(e){console.error(e);el("app").innerHTML='<div class="note">Os dados chegaram, mas houve um detalhe ao montar a tela. Recarregue; se persistir, me avise.<br><small style="color:#8b95a8">'+(e&&e.message||'')+'</small></div>';}}).catch(()=>{el("app").innerHTML='<div class="note">Ainda não consegui ler o <b>dados_fishermans.json</b> no repositório. Assim que o arquivo estiver lá, o painel aparece.</div>';});
</script>
</body></html>
